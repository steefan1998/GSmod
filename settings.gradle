pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'GSMod'

// Two separate mods, each with its own jar:
//   GSMod-Tech          (mod id gsmod)       machines, materials, upgrades, energy
//   GSMod-DailyRewards  (mod id gsmod_daily) daily rewards and missions
include 'GSMod-Tech', 'GSMod-DailyRewards'
