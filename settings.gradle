pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'GSMod'

// Separate mods, each with its own jar:
//   GSMod-Tech          (mod id gsmod)       machines, materials, upgrades, energy
//   GSMod-DailyRewards  (mod id gsmod_daily) daily rewards and missions
//   GSMod-Stages        (mod id gsmod_stages) end-game mods unlock after the Ender Dragon
include 'GSMod-Tech', 'GSMod-DailyRewards', 'GSMod-Stages'
