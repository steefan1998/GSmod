plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'GSMod-Tech'
}

// Mojang ships Java 25 to end users in 26.1, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    // Dev-only test driver (src/devcheck), never part of the release jar; only runDevCheck loads it.
    devcheck
}

evaluationDependsOn(':GSMod-DailyRewards')
def daily = project(':GSMod-DailyRewards')

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew :GSMod-Tech:runDevCheck : loads run-devcheck/saves/world, places the machines, opens the GUIs,
        // presses the daily buttons and takes screenshots into run-devcheck/screenshots, then quits.
        devCheck {
            client()
            gameDirectory = file('run-devcheck')
            programArguments.addAll('--quickPlaySingleplayer', 'world')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        // Daily Rewards is optional for Tech; it is loaded in dev runs so the mission hooks can be tested.
        gsmod_daily {
            sourceSet(daily.sourceSets.main)
        }
        gsmod_devcheck {
            sourceSet(sourceSets.devcheck)
        }
    }
}

neoForge.runs.configureEach { run ->
    if (run.name != 'devCheck') {
        run.loadedMods = [neoForge.mods.named(project.mod_id).get(), neoForge.mods.named('gsmod_daily').get()]
    }
}
neoForge.addModdingDependenciesTo(sourceSets.devcheck)

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Only the hooks in nl.gsmod.compat use it, and only when gsmod_daily is installed.
    compileOnly daily
    localRuntime daily
    devcheckImplementation(sourceSets.main.output)

    // Optional mods to load in dev runs for testing compat (see dev_runtime_mods in gradle.properties).
    (findProperty('dev_runtime_mods') ?: '').split(';').collect { it.trim() }.findAll { it }.each { path ->
        def jar = rootProject.file(path)
        if (jar.isFile()) {
            localRuntime files(jar)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
